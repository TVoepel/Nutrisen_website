<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(../wp-content/themes/gox/public/fonts/Poppins-latin_latin-ext-700.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:400;src:url(../wp-content/themes/gox/public/fonts/Poppins-latin_latin-ext-regular.woff2) format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Poppins,sans-serif;background:#0f2a5e;color:#fff}
img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.sh{position:absolute;inset:0;background:linear-gradient(100deg,#0f2a5e 8%,rgba(15,42,94,.82) 48%,rgba(11,78,162,.25) 100%)}
.in{position:absolute;left:72px;top:64px;right:72px;bottom:64px;display:flex;flex-direction:column;justify-content:space-between}
.logo{height:64px;width:auto;background:#fff;padding:10px 16px;border-radius:12px;align-self:flex-start}
h1{font-size:62px;line-height:1.1;font-weight:700;max-width:760px}
h1 em{font-style:normal;color:#06b262}
p{font-size:26px;opacity:.92;margin-top:20px}
.bar{height:8px;width:160px;border-radius:4px;background:linear-gradient(90deg,#06b262,#029998)}
</style>
<img class="bg" src="../assets/hero-agri-1600.webp"><div class="sh"></div>
<div class="in"><img class="logo" src="../assets/nutrisen-logo.webp" alt="">
<div><h1 id="h"></h1><p id="s"></p></div><div class="bar"></div></div>
<script>
const de=location.search.includes('de');
h.innerHTML=de?'Nitrat im Pflanzensaft.<br><em>Direkt auf dem Feld.</em>':'Nitrate in the plant sap.<br><em>Directly in the field.</em>';
s.textContent=de?'Bedarfsgerecht düngen mit Biosensoren':'Fertilize by need with biosensors';
</script>
